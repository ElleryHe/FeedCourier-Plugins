name: Publish Plugin Container Images

on:
  push:
    branches:
      - main
    paths:
      - "channels/ntfy/**"
      - "registry/ntfy.json"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-meta:
    name: Test & Resolve Image Metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate manifests and run bridge tests
        run: node scripts/build-index.mjs --check --verify-index && node --test channels/*/*.test.mjs

      - name: Resolve plugin version and GHCR image name
        id: meta
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          VERSION="$(node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync("registry/ntfy.json", "utf8")).version);')"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version '${VERSION}' in registry/ntfy.json"
            exit 1
          fi
          OWNER_LOWER="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/feedcourier-plugin-ntfy"
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Image (${{ matrix.platform }})
    needs:
      - test-and-meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.test-and-meta.outputs.image }}
          tags: |
            type=raw,value=${{ needs.test-and-meta.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.test-and-meta.outputs.version }}

      - name: Build and push native platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: channels/ntfy
          file: channels/ntfy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.test-and-meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ntfy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ntfy-${{ matrix.arch }}

      - name: Export pushed image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::Missing image digest output from docker/build-push-action"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload platform digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: ntfy-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Merge Multi-Arch Manifest (GHCR)
    runs-on: ubuntu-24.04
    needs:
      - test-and-meta
      - build
    steps:
      - name: Download platform digest artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ntfy-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and publish multi-arch manifest list
        env:
          IMAGE: ${{ needs.test-and-meta.outputs.image }}
          VERSION: ${{ needs.test-and-meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          DIGEST_FILES=("${RUNNER_TEMP}/digests"/*)
          if [[ "${#DIGEST_FILES[@]}" -ne 2 ]]; then
            echo "::error::Expected 2 platform digests (amd64 & arm64), found ${#DIGEST_FILES[@]}"
            exit 1
          fi

          ARGS=(
            --tag "${IMAGE}:${VERSION}"
            --tag "${IMAGE}:latest"
          )
          for file in "${DIGEST_FILES[@]}"; do
            ARGS+=("${IMAGE}@sha256:$(basename "${file}")")
          done

          docker buildx imagetools create "${ARGS[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
