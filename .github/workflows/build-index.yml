name: Build Marketplace Index

on:
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "schema/**"
      - "scripts/build-index.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index-main
  cancel-in-progress: false

jobs:
  build-index:
    name: Rebuild & Commit index.json
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate registry and rebuild index.json
        run: node scripts/build-index.mjs

      - name: Verify rebuilt index.json
        run: node scripts/build-index.mjs --check --verify-index

      - name: Commit updated index.json if changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore(index): rebuild plugin marketplace index.json"
          git push origin main
