name: Validate Plugin Registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "schema/**"
      - "channels/**"
      - "index.json"
      - "scripts/build-index.mjs"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "schema/**"
      - "channels/**"
      - "index.json"
      - "scripts/build-index.mjs"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Manifests & Bridge Tests (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Reject manual edits to generated index.json in pull requests
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx "index.json"; then
            echo "::error::Do not edit root index.json in pull requests; it is rebuilt automatically on merge to main (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Validate plugin manifests against schema (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/build-index.mjs --check

      - name: Validate plugin manifests (and verify index.json freshness when not pending auto-rebuild)
        if: github.event_name != 'pull_request'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/build-index.mjs --check --verify-index
            exit 0
          fi
          CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          if printf '%s\n' "${CHANGED}" | grep -Eq '^(registry/|schema/|scripts/build-index\.mjs$)' && ! printf '%s\n' "${CHANGED}" | grep -qx 'index.json'; then
            echo "Registry/schema changed without index.json (merged PR; build-index.yml rebuilds index.json asynchronously); running schema validation without --verify-index."
            node scripts/build-index.mjs --check
          else
            node scripts/build-index.mjs --check --verify-index
          fi

      - name: Run zero-dependency channel bridge unit tests
        run: node --test channels/*/*.test.mjs
