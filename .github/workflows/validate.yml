name: Validate Plugin Registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "schema/**"
      - "index.json"
      - "scripts/build-index.mjs"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "schema/**"
      - "index.json"
      - "scripts/build-index.mjs"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Manifests (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate plugin manifests and index.json against schema
        run: node scripts/build-index.mjs --check --verify-index
